name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run check --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm run test:e2e --prefix web
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install --editable .
      - run: python -m pip install --editable plugins/cluster-gpu
      - run: python -m unittest discover -s tests -v
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c 'import host_monitor; print(host_monitor.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "${PACKAGE_VERSION}" = "${TAG_VERSION}"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_release_artifacts.py dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hostmon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
